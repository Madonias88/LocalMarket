<main class="welcome-page">
  <div class="welcome-container">
    <div class="welcome-header">
      <span class="welcome-icon">🎉</span>
      <h1>¡Cuenta creada con éxito!</h1>
      <p>Bienvenido a LocalMarket. ¿Qué te gustaría hacer ahora?</p>
    </div>
    
    <div class="options-grid">
      <a routerLink="/negocios" class="option-card explore">
        <span class="icon">🔍</span>
        <h2>Explorar negocios</h2>
        <p>Descubre comercios locales, ofertas y más en tu área.</p>
      </a>
      
      <a routerLink="/registro" class="option-card create">
        <span class="icon">🏪</span>
        <h2>Crear un negocio</h2>
        <p>Registra tu comercio para empezar a recibir clientes.</p>
      </a>
    </div>
  </div>
</main>
